name: CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest

      - name: Preparar aplicacao para entrega
        run: |
          mkdir entrega
          cp main.py entrega/
          cp requirements.txt entrega/

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-app
          path: entrega/